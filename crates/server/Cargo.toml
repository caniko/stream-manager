[package]
name = "stream-manager-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Central stream-manager service: canonical chat/account/action state for native clients (never auto-deployed)"
license = "MIT OR Apache-2.0"

[lib]
name = "stream_manager_server"
path = "src/lib.rs"

[[bin]]
name = "stream-manager-server"
path = "src/main.rs"

[dependencies]
stream-manager-chat = { path = "../chat" }
stream-manager-core = { path = "../core" }
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "signal",
  "sync",
  "time",
  "net",
] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
anyhow = "1"
sha2 = "0.10"
base64 = "0.22"
futures-channel = "0.3"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
