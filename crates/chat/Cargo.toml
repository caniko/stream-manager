[package]
name = "stream-manager-chat"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "stream-manager chat workspace: normalized events, coordinator, provider chat adapters"
license = "MIT OR Apache-2.0"

[lib]
name = "stream_manager_chat"
path = "src/lib.rs"

[dependencies]
stream-manager-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "stream",
] }
url = "2"
base64 = "0.22"
sha2 = "0.10"
rsa = { version = "0.9", features = ["sha2"] }
futures-util = "0.3"
futures-channel = "0.3"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
pretty_assertions = "1"
rand = "0.8"
