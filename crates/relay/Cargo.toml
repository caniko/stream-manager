[package]
name = "kick-chat-relay"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Opt-in Kick webhook relay: verified provider ingress, authenticated desktop egress (never auto-deployed)"
license = "MIT OR Apache-2.0"

[[bin]]
name = "kick-chat-relay"
path = "src/main.rs"

[dependencies]
stream-manager-chat = { path = "../chat" }
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "signal",
  "sync",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
anyhow = "1"
tokio-stream = { version = "0.1", features = ["sync"] }
